<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>RAI — Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
    --info: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
  }
  h1 { margin: 0 0 4px 0; font-size: 22px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 13px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .card .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card .value {
    font-size: 28px;
    font-weight: 600;
    margin-top: 4px;
  }
  .card .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 { margin: 0 0 12px 0; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr:hover { background: rgba(255,255,255,0.02); cursor: pointer; }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .badge.cualificado { background: rgba(34,197,94,0.15); color: var(--accent); }
  .badge.incompleto  { background: rgba(56,189,248,0.15); color: var(--info); }
  .badge.escalado    { background: rgba(245,158,11,0.15); color: var(--warn); }
  .badge.frio        { background: rgba(148,163,184,0.15); color: var(--muted); }
  .row { display: flex; gap: 16px; }
  .row > * { flex: 1; }
  .bar {
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 6px;
  }
  .bar > div { height: 100%; background: var(--info); }
  .key-input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 12px;
    margin-left: 8px;
  }
  pre {
    background: #0a0f1c;
    padding: 12px;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 12px;
    margin: 0;
  }
  .msg-user      { color: var(--info); }
  .msg-assistant { color: var(--accent); }
  .empty { color: var(--muted); text-align: center; padding: 24px; font-size: 13px; }
  button {
    background: var(--info);
    color: #0f172a;
    border: 0;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 500;
    font-size: 12px;
  }
</style>
</head>
<body>
<h1>RAI — Dashboard</h1>
<div class="subtitle">
  Asistente virtual de Raidasl · WhatsApp L1
  <input id="key" class="key-input" placeholder="API key (si está configurada)" />
  <button onclick="refresh()">Refrescar</button>
</div>

<div class="grid" id="kpi-cards"></div>

<div class="row">
  <div class="panel" style="flex: 2;">
    <h2>Leads (últimos)</h2>
    <table id="leads-table">
      <thead><tr><th>ID</th><th>Teléfono</th><th>Nombre</th><th>Estado</th><th>Último contacto</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div class="panel">
    <h2>Distribución por tipo de inmueble</h2>
    <div id="inmueble-chart"></div>
    <h2 style="margin-top: 20px;">Top CP (prefijo)</h2>
    <div id="cp-chart"></div>
    <h2 style="margin-top: 20px;">Motivos de escalado</h2>
    <div id="escalado-chart"></div>
  </div>
</div>

<div class="panel" id="conversation-panel" style="display:none;">
  <h2>Conversación del lead <span id="conv-lead-id"></span></h2>
  <pre id="conv-content"></pre>
</div>

<script>
function authHeaders() {
  const k = document.getElementById('key').value.trim();
  return k ? { 'X-Admin-API-Key': k } : {};
}

async function fetchJson(url) {
  const r = await fetch(url, { headers: authHeaders() });
  if (r.status === 401) {
    alert('API key inválida o ausente. Introduce la clave arriba.');
    throw new Error('401');
  }
  return r.json();
}

function renderKpis(k) {
  const cards = [
    { label: 'Leads totales', value: k.leads_total },
    { label: 'Cualificados', value: (k.leads_por_estado?.cualificado || 0), sub: `${k.pct_cualificados}%` },
    { label: 'Incompletos', value: (k.leads_por_estado?.incompleto || 0), sub: `${k.pct_incompletos}%` },
    { label: 'Escalados', value: (k.leads_por_estado?.escalado || 0), sub: `${k.pct_escalados}%` },
    { label: 'Fríos', value: (k.leads_por_estado?.frio || 0) },
    {
      label: 'Tiempo medio cualif.',
      value: k.tiempo_medio_cualificacion_segundos != null
        ? Math.round(k.tiempo_medio_cualificacion_segundos / 60) + ' min'
        : '—',
    },
  ];
  document.getElementById('kpi-cards').innerHTML = cards.map(c => `
    <div class="card">
      <div class="label">${c.label}</div>
      <div class="value">${c.value ?? 0}</div>
      ${c.sub ? `<div class="sub">${c.sub}</div>` : ''}
    </div>`).join('');
}

function renderBars(containerId, data) {
  const entries = Object.entries(data || {});
  if (entries.length === 0) {
    document.getElementById(containerId).innerHTML = '<div class="empty">Sin datos aún</div>';
    return;
  }
  const max = Math.max(...entries.map(([_, v]) => v));
  document.getElementById(containerId).innerHTML = entries.map(([key, val]) => `
    <div style="margin-bottom: 8px;">
      <div style="display:flex; justify-content:space-between; font-size:12px;">
        <span>${key}</span><span style="color: var(--muted);">${val}</span>
      </div>
      <div class="bar"><div style="width: ${(val/max*100).toFixed(0)}%"></div></div>
    </div>`).join('');
}

function renderLeads(leads) {
  const tbody = document.querySelector('#leads-table tbody');
  if (leads.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">Sin leads aún. Inicia una conversación con RAI desde WhatsApp.</td></tr>';
    return;
  }
  tbody.innerHTML = leads.slice(0, 50).map(l => `
    <tr onclick="loadConv(${l.id})">
      <td>${l.id}</td>
      <td>${(l.phone || '').replace('whatsapp:', '')}</td>
      <td>${l.name || '—'}</td>
      <td><span class="badge ${l.status}">${l.status}</span></td>
      <td style="color: var(--muted);">${new Date(l.last_contact_at).toLocaleString('es-ES')}</td>
    </tr>`).join('');
}

async function loadConv(leadId) {
  const msgs = await fetchJson(`/leads/${leadId}/messages`);
  document.getElementById('conv-lead-id').textContent = `#${leadId}`;
  document.getElementById('conversation-panel').style.display = 'block';
  document.getElementById('conv-content').innerHTML = msgs.map(m => {
    const cls = m.role === 'user' ? 'msg-user' : 'msg-assistant';
    return `<span class="${cls}">[${m.role}]</span> ${escapeHtml(m.content)}\n`;
  }).join('\n');
  document.getElementById('conversation-panel').scrollIntoView({ behavior: 'smooth' });
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function refresh() {
  try {
    const [kpis, leads] = await Promise.all([
      fetchJson('/kpis'),
      fetchJson('/leads'),
    ]);
    renderKpis(kpis);
    renderLeads(leads);
    renderBars('inmueble-chart', kpis.distribucion_tipo_inmueble);
    renderBars('cp-chart', kpis.distribucion_cp_prefijo);
    renderBars('escalado-chart', kpis.motivos_escalado);
  } catch (e) { console.error(e); }
}

// Pre-fill key from URL ?key= if present
const urlKey = new URLSearchParams(location.search).get('key');
if (urlKey) document.getElementById('key').value = urlKey;
refresh();
setInterval(refresh, 30000); // auto-refresh cada 30s
</script>
</body>
</html>
